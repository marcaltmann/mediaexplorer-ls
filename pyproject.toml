[project]
name = "media-explorer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "~=3.14.2"
dependencies = [
    "aiosqlite~=0.22.1",
    "asyncpg~=0.31.0",
    "boto3~=1.42.26",
    "litestar-vite~=0.17.0",
    "litestar[standard,sqlalchemy]~=2.19.0",
    "requests~=2.32.5",
]

[dependency-groups]
dev = [
    "beautifulsoup4~=4.14.3",
    "pytest~=9.0.1",
    "types-requests~=2.32.4.20260107",
]

[tool.ruff.format]
quote-style = "single"

[pytest]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    # note the use of single quote below to denote "raw" strings in TOML
    'ignore:use inspect.iscoroutinefunction\(\) instead:DeprecationWarning',
]
